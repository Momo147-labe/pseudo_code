name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Installer Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 3️⃣ Activer le support Windows
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # 4️⃣ Installer les dépendances
      - name: Install dependencies
        run: flutter pub get

      # 5️⃣ Générer le fichier .env à partir des secrets GitHub
      - name: Create .env file
        shell: pwsh
        run: |
          "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" | Out-File -FilePath .env -Encoding utf8
          "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" | Out-File -FilePath .env -Append -Encoding utf8
          "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" | Out-File -FilePath .env -Append -Encoding utf8
          "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" | Out-File -FilePath .env -Append -Encoding utf8
          "OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}" | Out-File -FilePath .env -Append -Encoding utf8

      # 6️⃣ Build Windows Release
      - name: Build Windows EXE
        run: flutter build windows --release

      # 6️⃣ Vérifier que le dossier Release existe
      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/x64/runner/Release")) {
            Write-Error "❌ Dossier Release introuvable"
            exit 1
          }
          Get-ChildItem build/windows/x64/runner/Release
      # 7️⃣ Détecter le .exe
      - name: Get EXE name
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/windows/x64/runner/Release/*.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error "❌ Aucun EXE trouvé"
            exit 1
          }
          echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_ENV
          echo "✔ EXE trouvé : $($exe.Name)"
      # 8️⃣ Installer Inno Setup via Chocolatey
      - name: Install Inno Setup
        run: choco install innosetup -y

      # 9️⃣ Vérifier que le fichier installer.iss existe
      - name: Verify installer.iss exists
        shell: pwsh
        run: |
          if (!(Test-Path "installer.iss")) {
            Write-Error "❌ installer.iss introuvable !"
            exit 1
          }
          Write-Host "✔ installer.iss trouvé"
      # 🔟 Générer Setup.exe avec le chemin complet de ISCC
      - name: Build Setup.exe with Inno Setup
        shell: pwsh
        run: |
          mkdir Output -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"
      # 1️⃣1️⃣ Upload du Setup.exe comme artifact
      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: Output/*.exe