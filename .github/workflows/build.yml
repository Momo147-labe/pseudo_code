name: CI/CD Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1 : ANDROID BUILD & DEPLOY
  # ==========================================
  build-deploy-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "BACKBLAZE_keyID=${{ secrets.BACKBLAZE_keyID }}" >> .env
          echo "BACKBLAZE_applicationKey=${{ secrets.BACKBLAZE_applicationKey }}" >> .env
          echo "BACKBLAZE_BUCKET_ID=${{ secrets.BACKBLAZE_BUCKET_ID }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Deploy to B2 & Supabase
        env:
          BACKBLAZE_keyID: ${{ secrets.BACKBLAZE_keyID }}
          BACKBLAZE_applicationKey: ${{ secrets.BACKBLAZE_applicationKey }}
          BACKBLAZE_BUCKET_ID: ${{ secrets.BACKBLAZE_BUCKET_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          chmod +x scripts/deploy_update.sh
          ./scripts/deploy_update.sh android

  # ==========================================
  # JOB 2 : WINDOWS BUILD & DEPLOY
  # ==========================================
  build-deploy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env
        shell: pwsh
        run: |
          "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" | Out-File -FilePath .env -Encoding utf8
          "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" | Out-File -FilePath .env -Append -Encoding utf8
          "BACKBLAZE_keyID=${{ secrets.BACKBLAZE_keyID }}" | Out-File -FilePath .env -Append -Encoding utf8
          "BACKBLAZE_applicationKey=${{ secrets.BACKBLAZE_applicationKey }}" | Out-File -FilePath .env -Append -Encoding utf8
          "BACKBLAZE_BUCKET_ID=${{ secrets.BACKBLAZE_BUCKET_ID }}" | Out-File -FilePath .env -Append -Encoding utf8

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Deploy to B2 & Supabase
        shell: bash # Utilise bash fourni par git sur windows
        env:
          BACKBLAZE_keyID: ${{ secrets.BACKBLAZE_keyID }}
          BACKBLAZE_applicationKey: ${{ secrets.BACKBLAZE_applicationKey }}
          BACKBLAZE_BUCKET_ID: ${{ secrets.BACKBLAZE_BUCKET_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Correction du chemin car le script attend build/windows/x64/runner/Release/pseudo_code_installer.exe
          # On s'assure que le fichier généré par Inno Setup est au bon endroit ou on adapte le script
          chmod +x scripts/deploy_update.sh
          ./scripts/deploy_update.sh windows